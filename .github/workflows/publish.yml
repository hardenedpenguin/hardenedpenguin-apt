name: Publish APT repository

on:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'keyring/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag for synced releases (empty = latest per repo)
        type: string
        default: ''
  repository_dispatch:
    types: [publish-debs]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-apt-repo
  cancel-in-progress: false

env:
  REPO_BASE_URL: https://hardenedpenguin.github.io/hardenedpenguin-apt/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg curl jq

      - name: Prepare package incoming directory
        run: mkdir -p packages/incoming

      - name: Import existing published packages
        run: |
          chmod +x scripts/import-from-published-repo.sh
          ./scripts/import-from-published-repo.sh || true

      - name: Sync GitHub release packages
        run: |
          tag="${{ inputs.release_tag || github.event.client_payload.release_tag || '' }}"
          chmod +x scripts/sync-github-release.sh
          sync_repo() {
            if [[ -n "$tag" ]]; then
              ./scripts/sync-github-release.sh "$1" "$tag"
            else
              ./scripts/sync-github-release.sh "$1"
            fi
          }
          sync_repo hardenedpenguin/SkywarnPlus-NG
          sync_repo hardenedpenguin/supermon-ng
          sync_repo hardenedpenguin/saytime_weather_rb
          sync_repo hardenedpenguin/sayip-reboot-halt-saypublicip
          sync_repo hardenedpenguin/internet_monitor_rb
          sync_repo hardenedpenguin/cap-alert
          sync_repo hardenedpenguin/AnyTone_CPS
          sync_repo hardenedpenguin/NicFW_CPS

      - name: Copy dispatched .deb URLs
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.deb_urls
        env:
          DEB_URLS: ${{ toJson(github.event.client_payload.deb_urls) }}
        run: |
          echo "$DEB_URLS" | jq -r '.[]' | while read -r url; do
            fname="$(basename "$url")"
            echo "Fetching $fname ..."
            curl -fsSL -o "packages/incoming/$fname" "$url"
          done

      - name: Build archive keyring package
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          chmod +x keyring/build.sh
          ./keyring/build.sh packages/incoming

      - name: Split packages by Debian suite
        run: |
          chmod +x scripts/split-packages-by-suite.sh
          ./scripts/split-packages-by-suite.sh

      - name: Verify packages present
        run: |
          for suite in stable bookworm trixie; do
            count=$(find "packages/$suite" -maxdepth 1 -name '*.deb' 2>/dev/null | wc -l)
            echo "$suite: $count package(s)"
          done
          total=$(find packages/stable packages/bookworm packages/trixie -maxdepth 1 -name '*.deb' 2>/dev/null | wc -l)
          if [[ "$total" -eq 0 ]]; then
            echo "No .deb files after split; check sync/import steps." >&2
            exit 1
          fi
          ls -lh packages/*/*.deb

      - name: Build signed APT repository
        id: build-apt-repo
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          chmod +x scripts/build-apt-repo.sh
          out="$(mktemp -d)"
          ./scripts/build-apt-repo.sh "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Add landing page and pubkey
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          cp public/index.html "${{ steps.build-apt-repo.outputs.dir }}/index.html"
          gpg --armor --export "${{ vars.GPG_KEY_ID }}" > "${{ steps.build-apt-repo.outputs.dir }}/pubkey.asc"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build-apt-repo.outputs.dir }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: echo "Published to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
